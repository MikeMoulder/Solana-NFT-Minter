<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" fill="#080808"/>
  <!-- Diamond gem shape -->
  <polygon points="16,4 28,12 28,20 16,28 4,20 4,12" fill="#9945FF" opacity="0.15"/>
  <polygon points="16,4 28,12 28,20 16,28 4,20 4,12" fill="none" stroke="#9945FF" stroke-width="1.5"/>
  <!-- Inner highlight facets -->
  <polyline points="4,12 16,17 28,12" fill="none" stroke="#9945FF" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="4" x2="16" y2="17" stroke="#9945FF" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="17" x2="16" y2="28" stroke="#9945FF" stroke-width="1" opacity="0.4"/>
  <!-- Top-left facet highlight -->
  <polygon points="16,4 4,12 16,17" fill="#9945FF" opacity="0.2"/>
  <!-- Top-right facet slightly brighter -->
  <polygon points="16,4 28,12 16,17" fill="#9945FF" opacity="0.35"/>
</svg>
